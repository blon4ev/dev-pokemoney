<body>
    <div class="liquid-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    
    <div id="battle-toast" class="toast-wrapper">
        <div class="retro-toast-box"><p id="battle-toast-msg" class="retro-toast-text">메시지</p></div>
    </div>

    <div class="iphone-frame">
        
        <div id="screen-tama" class="screen active" style="padding-top:0; padding-left:0; padding-right:0;">
            <div class="header-nav" style="padding-top:calc(10px + env(safe-area-inset-top)); margin-bottom:0; background:var(--bg-main); z-index:10;">
                <h1 class="month-label" style="font-size:18px;">내 포켓몬</h1>
                <div class="header-actions">
                    <button class="action-btn" onclick="addDevCandy()" style="font-size:14px;">🛠️</button>
                    <button class="action-btn" onclick="openSettings()">⚙️</button>
                </div>
            </div>

            <div class="battle-top-section" id="pokemon-stage">
                <div class="hp-box-wrapper">
                    <div class="hp-box">
                        <div class="hp-top">
                            <div class="hp-name"><span id="tamaName">알</span><span id="tamaNameEditIcon" style="font-size:14px; cursor:pointer; margin-left:4px;" onclick="changeName()">✏️</span></div>
                            <div class="hp-level" id="tamaLevel">Lv.1</div>
                        </div>
                        <div class="hp-bottom">
                            <span class="hp-label">XP</span>
                            <div class="hp-bar-track"><div class="hp-bar-fill" id="tamaExpFill"></div></div>
                        </div>
                    </div>
                </div>

                <div class="tama-character-wrapper" id="pokemon-wrapper">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/underground.png" class="battle-base" alt="">
                    <img src="" id="pokemon-img" class="tama-character" style="display:none;" alt="">
                    <img src="https://play.pokemonshowdown.com/sprites/gen5/egg.png" id="pokemon-egg" class="tama-character" style="width:60px; object-fit:contain; display:none;" alt="">
                </div>
            </div>
            
            <div class="control-panel-wrapper">
                <div class="retro-dialog-box" style="padding:14px;">
                    <div class="info-row">
                        <span id="tamaStreak" style="color:var(--accent-orange); font-weight:bold;">🔥 0일 연속 기록</span>
                        <span id="candy-limit-text">접속 5개 / 기록 보상</span>
                    </div>
                    <div class="action-row" style="margin-top:0;">
                        <button class="retro-btn candy-btn" id="feed-candy-btn" onclick="feedCandy()">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/rare-candy.png" style="width:24px; image-rendering:pixelated;" alt="candy">
                            <span id="candy-count-display" style="font-size:16px;">0</span>개
                        </button>
                        <button class="retro-btn new-egg-btn" onclick="buyNewEgg()" style="height:40px;">
                            <img src="https://play.pokemonshowdown.com/sprites/gen5/egg.png" style="width:18px; image-rendering:pixelated;" alt="egg">
                            <span style="font-size:14px;">새 알(2🍬)</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="weekly-list-area scroll-container">
                <div class="weekly-sticky-header"><div class="weekly-header-title">이번 주 내역</div></div>
                <div id="tama-weekly-list"></div>
            </div>
        </div>

        <div id="screen-pokedex" class="screen">
            <div class="header-nav" style="justify-content:center;"><h1 class="month-label">포켓몬 도감</h1></div>
            <div class="retro-dialog-box" style="margin: 0 15px 10px 15px; padding:10px; text-align:center;">
                <div style="font-size:14px; color:var(--text-main); font-weight:bold;">발견한 포켓몬: <span id="dex-count" style="color:var(--accent-blue);">0</span> / 151</div>
            </div>
            <div class="pokedex-scroll scroll-container" style="flex:1; overflow-y:auto; padding:0 15px 20px 15px;">
                <div class="pokedex-grid" id="pokedex-grid"></div>
            </div>
        </div>

        <div id="screen-ledger" class="screen">
            <div class="header-nav">
                <div style="display:flex; align-items:center; gap:8px;">
                    <button class="action-btn" onclick="moveMonth(-1)">&#10094;</button><h1 class="month-label" id="month-name">2026년 3월</h1><button class="action-btn" onclick="moveMonth(1)">&#10095;</button>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="filter-btn" onclick="toggleFilterBar()">⌥</button>
                    <button class="action-btn" onclick="openStatsModal()">📊</button>
                </div>
            </div>
            <div id="filter-bar" class="filter-bar scroll-container"></div>
            <div class="compact-summary retro-dialog-box">
                <div class="sum-item"><div class="sum-label">수입</div><div class="sum-val" id="sum-in" style="color:var(--accent-green);">0원</div></div>
                <div class="sum-item"><div class="sum-label" style="margin-left:auto; margin-right:auto;">지출</div><div class="sum-val" id="sum-ex" style="color:var(--accent-red);">0원</div></div>
            </div>
            <div class="calendar-grid retro-dialog-box" id="cal-grid"></div>
            <div id="selected-date-text" style="color:var(--text-main); font-size:16px; margin-bottom:10px; font-weight:bold; padding-left:20px; flex-shrink: 0;"></div>
            <div class="list-area scroll-container" id="list-area" style="background:transparent; padding:0 15px 20px 15px;"></div>
            <button class="fab" onclick="openInputScreen()">+</button>
        </div>

        <div id="screen-goal" class="screen">
            <div class="header-nav" style="justify-content:center;"><h1 class="month-label">예산 및 목표</h1></div>
            <div class="retro-dialog-box budget-status-card">
                <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;">
                    <span style="font-size: 15px; color: var(--text-main); font-weight:bold;">이달의 남은 예산</span><span id="budget-remain-amt-goal" style="font-size: 22px; color: var(--text-main); font-weight:bold;">0원</span>
                </div>
                <div class="progress-track" style="margin-bottom:6px; height:14px; background:#202020; box-shadow: 0 -2px 0 0 #FFF, 0 2px 0 0 #FFF, -2px 0 0 0 #FFF, 2px 0 0 0 #FFF; margin:2px;">
                    <div class="exp-fill" id="budget-progress-goal"></div>
                </div>
                <div id="budget-percent-goal" style="font-size:13px; color:var(--text-dim); text-align:right; font-weight:bold;">0% 사용</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px; margin-top:10px; flex-shrink:0;">
                <div style="color:var(--text-main); font-size:16px; margin-bottom:12px; font-weight:bold;">총 예산 수정하기</div>
                <div id="total-budget-input" class="total-budget-input" onclick="openBudgetNumpad('total')" style="font-size: 32px; border-bottom: 3px solid var(--text-main);">0원</div>
            </div>
            <div class="cat-budget-list retro-dialog-box" id="cat-budget-list"></div>
            <div style="padding:15px; flex-shrink:0;"><button class="retro-btn save-btn-large" style="background:#404040; color:white; height:54px; margin-top:0;" onclick="validateAndSaveBudget()">설정 완료 (주간 10🍬)</button></div>
        </div>

        <div class="add-cat-overlay" id="settings-overlay">
            <div class="add-cat-sheet">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="color:var(--text-main); margin:0; font-size:20px;">설정 및 백업</h3>
                    <button class="action-btn" style="width:auto; padding:0 12px; font-size:14px;" onclick="closeSettings()">닫기</button>
                </div>
                <div style="font-size:14px; color:var(--text-dim); margin-bottom:20px; line-height:1.5;">앱의 모든 데이터(가계부, 도감, 사탕 등)를 기기에 파일로 저장하거나 불러올 수 있습니다.</div>
                <button class="retro-btn save-btn-large" style="background:var(--accent-blue); color:white; font-size:16px; height:50px; margin-bottom:10px;" onclick="exportData()">💾 데이터 내보내기 (백업)</button>
                <button class="retro-btn save-btn-large" style="background:white; color:var(--text-main); font-size:16px; height:50px; margin-bottom:10px;" onclick="document.getElementById('import-file').click()">📂 데이터 불러오기 (복원)</button>
                <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
            </div>
        </div>

        <div class="stats-modal scroll-container" id="stats-modal">...</div>
        <div id="screen-budget-input" class="screen">...</div>
        <div id="screen-input" class="screen">...</div>
        <div id="screen-detail" class="screen">...</div>
        <div class="add-cat-overlay" id="add-cat-overlay">...</div>
        <div class="multi-picker-overlay" id="multi-picker">...</div>
        <div class="modal-overlay" id="modal-overlay">...</div>

        <div class="tab-bar">
            <div class="tab-item active" id="tab-tama" onclick="switchTab('tama')"><div class="tab-icon">🐾</div><div class="tab-label">내 포켓몬</div></div>
            <div class="tab-item" id="tab-pokedex" onclick="switchTab('pokedex')"><div class="tab-icon">📖</div><div class="tab-label">도감</div></div>
            <div class="tab-item" id="tab-ledger" onclick="switchTab('ledger')"><div class="tab-icon">🗓️</div><div class="tab-label">가계부</div></div>
            <div class="tab-item" id="tab-goal" onclick="switchTab('goal')"><div class="tab-icon">🎯</div><div class="tab-label">목표</div></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
